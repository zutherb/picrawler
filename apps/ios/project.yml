# XcodeGen project: `brew install xcodegen && xcodegen` creates PiCrawler.xcodeproj
name: PiCrawler
options:
  bundleIdPrefix: de.zuther
  deploymentTarget:
    iOS: "17.0"
targets:
  PiCrawler:
    type: application
    platform: iOS
    sources: [PiCrawler]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.zuther.picrawler
        TARGETED_DEVICE_FAMILY: "1,2"          # iPhone and iPad
        SWIFT_VERSION: "5.10"
        CODE_SIGN_ENTITLEMENTS: PiCrawler/Support/PiCrawler.entitlements
        INFOPLIST_FILE: PiCrawler/Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
