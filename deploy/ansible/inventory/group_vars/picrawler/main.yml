---
picrawler_robot_id: "1"
picrawler_user: picrawler

# Set to true once the service code (services/body, ...) exists (milestone M2).
picrawler_services_start: false

# Sensors that run on the Pi itself, one systemd instance each.
picrawler_sensors:
  - ultrasonic

# MQTT accounts. Passwords come from vault.yml (see vault.example.yml).
mosquitto_users:
  - name: body
    role: body
    password: "{{ vault_mqtt_password_body }}"
  - name: arbiter
    role: arbiter
    password: "{{ vault_mqtt_password_arbiter }}"
  - name: sensor-ultrasonic
    role: sensor
    sensor: ultrasonic
    password: "{{ vault_mqtt_password_sensor_ultrasonic }}"

# Only localhost by default. Remote sensors need a non-local address,
# which requires TLS or an explicit opt-in (see roles/mosquitto/defaults).
mosquitto_listen_address: "127.0.0.1"
