---
# Copy to vault.yml, set long random passwords, then encrypt:
#   ansible-vault encrypt inventory/group_vars/picrawler/vault.yml
vault_mqtt_password_body: "CHANGE_ME_min_16_chars"
vault_mqtt_password_arbiter: "CHANGE_ME_min_16_chars"
vault_mqtt_password_sensor_ultrasonic: "CHANGE_ME_min_16_chars"
vault_mqtt_password_sensor_gamepad: "CHANGE_ME_min_16_chars"
vault_mqtt_password_sensor_vision: "CHANGE_ME_min_16_chars"
vault_mqtt_password_ui: "CHANGE_ME_min_16_chars"
# python3 -m services.web.hashpw  (prints scrypt$...)
vault_web_admin_password_hash: "scrypt$CHANGE_ME"
