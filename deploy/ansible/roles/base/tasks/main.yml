---
- name: Install base packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Check whether I2C is enabled
  ansible.builtin.command: raspi-config nonint get_i2c
  register: base_i2c_state
  changed_when: false

- name: Enable I2C
  ansible.builtin.command: raspi-config nonint do_i2c 0
  when: base_i2c_state.stdout | trim != "0"
  changed_when: true
  notify: Reboot for I2C

- name: Create the apex group for the Coral TPU
  ansible.builtin.group:
    name: apex
    system: true

- name: Create service user
  ansible.builtin.user:
    name: "{{ base_user }}"
    system: true
    home: "{{ base_home }}"
    create_home: true
    shell: /usr/sbin/nologin
    # video: camera, input: gamepad, apex: Coral TPU (see spikes/coral)
    groups: [i2c, gpio, video, input, apex]
    append: true

- name: Create web UI user
  ansible.builtin.user:
    name: "{{ base_web_user }}"
    system: true
    home: "{{ base_home }}-web"
    create_home: true
    shell: /usr/sbin/nologin
    # bluetooth: BlueZ D-Bus, systemd-journal: service logs, video: vcgencmd,
    # base user group: enter /etc/picrawler
    groups: [bluetooth, systemd-journal, video, "{{ base_user }}"]
    append: true

- name: Flush handlers so I2C is active before the robot stack is installed
  ansible.builtin.meta: flush_handlers
