---
- name: Validate MQTT settings
  ansible.builtin.assert:
    that:
      - mosquitto_users | length > 0
      - mosquitto_users | map(attribute='role') | difference(['body', 'arbiter', 'sensor', 'ui', 'agent', 'voice', 'display']) | length == 0
      - mosquitto_users | selectattr('role', 'equalto', 'sensor') | rejectattr('sensor', 'defined') | list | length == 0
      - mosquitto_listen_address in ['127.0.0.1', 'localhost', '::1'] or (mosquitto_allow_plaintext_remote | bool)
    fail_msg: >-
      Invalid mosquitto_users, or a remote listener without TLS. Remote
      access requires mosquitto_allow_plaintext_remote: true (TLS is not
      configured by this role yet).
    quiet: true

- name: Validate MQTT passwords
  ansible.builtin.assert:
    that:
      - item.password | length >= 16
      - "'CHANGE_ME' not in item.password"
    fail_msg: "MQTT password for {{ item.name }} is missing, too short or still the example value."
    quiet: true
  loop: "{{ mosquitto_users }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Install mosquitto
  ansible.builtin.apt:
    name: [mosquitto, mosquitto-clients]
    state: present

- name: Create client secret directory
  ansible.builtin.file:
    path: "{{ mosquitto_client_secret_dir }}"
    state: directory
    owner: root
    group: root
    # traverse only; each file below is readable by its own service user
    mode: "0711"

- name: Write client password files
  ansible.builtin.copy:
    content: "{{ item.password }}\n"
    dest: "{{ mosquitto_client_secret_dir }}/{{ item.name }}.pass"
    owner: "{{ item.owner | default(mosquitto_client_secret_owner) }}"
    group: "{{ item.owner | default(mosquitto_client_secret_owner) }}"
    mode: "0600"
  loop: "{{ mosquitto_users }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  register: mosquitto_client_secrets

- name: Check broker password file
  ansible.builtin.stat:
    path: /etc/mosquitto/picrawler.passwd
  register: mosquitto_passwd_file

# mosquitto_passwd salts every hash, so only rebuild when a password changed.
- name: Build broker password file
  ansible.builtin.shell: |
    set -eu
    umask 077
    tmp=$(mktemp)
    trap 'rm -f "$tmp"' EXIT
    # user:password lines, hashed in place by -U (keeps passwords out of argv)
    {% for user in mosquitto_users %}
    printf '%s:%s\n' '{{ user.name }}' "$(cat '{{ mosquitto_client_secret_dir }}/{{ user.name }}.pass')" >> "$tmp"
    {% endfor %}
    mosquitto_passwd -U "$tmp"
    install -o mosquitto -g mosquitto -m 0600 "$tmp" /etc/mosquitto/picrawler.passwd
  args:
    executable: /bin/bash
  when: mosquitto_client_secrets.changed or not mosquitto_passwd_file.stat.exists
  changed_when: true
  no_log: true
  notify: Restart mosquitto

- name: Write ACL file
  ansible.builtin.template:
    src: picrawler.acl.j2
    dest: /etc/mosquitto/picrawler.acl
    owner: mosquitto
    group: mosquitto
    mode: "0600"
  notify: Restart mosquitto

- name: Write broker config
  ansible.builtin.template:
    src: picrawler.conf.j2
    dest: /etc/mosquitto/conf.d/picrawler.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart mosquitto

- name: Enable mosquitto
  ansible.builtin.systemd_service:
    name: mosquitto
    enabled: true
    state: started
