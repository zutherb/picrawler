---
- name: Check the hotspot password
  ansible.builtin.assert:
    that:
      - network_hotspot_psk | length >= 8
      - network_hotspot_psk | length <= 63
      - "'CHANGE_ME' not in network_hotspot_psk"
    fail_msg: "vault_hotspot_psk must be 8-63 characters and not the example value."
    quiet: true
  no_log: true

- name: Read service states
  ansible.builtin.service_facts:

- name: Check that NetworkManager runs (Raspberry Pi OS Bookworm default)
  ansible.builtin.assert:
    that: ansible_facts.services['NetworkManager.service'].state | default('') == 'running'
    fail_msg: "The hotspot needs NetworkManager (Bookworm default). Set network_hotspot_enabled: false otherwise."
    quiet: true

- name: Install iw (counts phones connected to the hotspot)
  ansible.builtin.apt:
    name: [iw]
    state: present

- name: Read the Wi-Fi country
  ansible.builtin.command: raspi-config nonint get_wifi_country
  register: network_country
  changed_when: false
  failed_when: false

- name: Set the Wi-Fi country (required for access point mode)
  ansible.builtin.command: raspi-config nonint do_wifi_country {{ network_wifi_country }}
  when: network_country.stdout | trim != network_wifi_country
  changed_when: true

- name: Look for the hotspot profile
  ansible.builtin.command: nmcli -t -f NAME connection show
  register: network_profiles
  changed_when: false

- name: Create the hotspot profile
  ansible.builtin.command: >-
    nmcli connection add type wifi ifname {{ network_interface }} con-name {{ network_hotspot_profile }}
    autoconnect no ssid {{ network_hotspot_ssid }}
  when: network_hotspot_profile not in network_profiles.stdout_lines
  changed_when: true

- name: Read the hotspot settings
  ansible.builtin.command: >-
    nmcli -s -g 802-11-wireless.ssid,802-11-wireless.mode,802-11-wireless.band,802-11-wireless.channel,ipv4.method,ipv4.addresses,802-11-wireless-security.psk
    connection show {{ network_hotspot_profile }}
  register: network_current
  changed_when: false
  no_log: true

- name: Configure the hotspot (WPA2, shared IPv4 with DHCP on 10.42.0.1)
  ansible.builtin.command: >-
    nmcli connection modify {{ network_hotspot_profile }}
    connection.autoconnect no
    802-11-wireless.ssid {{ network_hotspot_ssid }}
    802-11-wireless.mode ap
    802-11-wireless.band {{ network_hotspot_band }}
    802-11-wireless.channel {{ network_hotspot_channel }}
    ipv4.method shared ipv4.addresses 10.42.0.1/24 ipv6.method disabled
    wifi-sec.key-mgmt wpa-psk wifi-sec.proto rsn wifi-sec.pairwise ccmp wifi-sec.group ccmp
    wifi-sec.psk {{ network_hotspot_psk }}
  when: >-
    network_current.stdout_lines != [network_hotspot_ssid, 'ap', network_hotspot_band,
    network_hotspot_channel | string, 'shared', '10.42.0.1/24', network_hotspot_psk]
  changed_when: true
  no_log: true

- name: Add client networks
  ansible.builtin.command: >-
    nmcli connection add type wifi ifname {{ network_interface }} con-name "{{ item.ssid }}"
    ssid "{{ item.ssid }}" wifi-sec.key-mgmt wpa-psk wifi-sec.psk "{{ item.psk }}"
    connection.autoconnect yes connection.autoconnect-priority {{ item.priority | default(10) }}
  loop: "{{ network_wifi_networks }}"
  when: item.ssid not in network_profiles.stdout_lines
  changed_when: true
  no_log: true

- name: Install the watcher
  ansible.builtin.copy:
    src: netwatch.py
    dest: "{{ network_script_dir }}/netwatch.py"
    owner: root
    group: root
    mode: "0755"
  notify: Restart netwatch

- name: Install the watcher unit
  ansible.builtin.template:
    src: picrawler-netwatch.service.j2
    dest: /etc/systemd/system/picrawler-netwatch.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart netwatch

- name: Enable and start the watcher
  ansible.builtin.systemd_service:
    name: picrawler-netwatch.service
    enabled: true
    state: started
    daemon_reload: true
