---
picrawler_user: picrawler
picrawler_web_user: picrawler-web
picrawler_state_dir: /var/lib/picrawler
picrawler_web_state_dir: /var/lib/picrawler-web    # home of the web user (base role)
# With the storage role, units wait for these (bind mounts from the NVMe)
# instead of writing to the SD card underneath when the NVMe is missing.
picrawler_requires_mounts: "{{ [picrawler_install_dir, picrawler_state_dir, picrawler_web_state_dir] if storage_enabled | default(true) | bool else [] }}"
picrawler_robot_id: "1"
picrawler_install_dir: /opt/picrawler
picrawler_src_dir: "{{ picrawler_install_dir }}/src"
picrawler_venv: "{{ picrawler_install_dir }}/venv"
picrawler_config_dir: /etc/picrawler

# rsync: copy the local checkout from the control machine (default)
# git:   clone picrawler_git_repo at picrawler_git_version on the Pi
picrawler_source_mode: rsync
picrawler_local_source: "{{ playbook_dir }}/../../"
picrawler_git_repo: ""
picrawler_git_version: motion-framework

# Pin to a commit SHA for reproducible installs.
picrawler_robot_hat_repo: https://github.com/sunfounder/robot-hat.git
picrawler_robot_hat_version: 2.5.x
picrawler_robot_hat_install_overlays: true

picrawler_pip_packages:
  - smbus2
  - paho-mqtt>=2,<3
# LiteRT-LM Python API for the agent (Gemma 4 E2B on the CPU)
picrawler_agent_pip_packages:
  - litert-lm-api

# Start/enable the units. Starting the body initializes the servos, so
# enable this after a first manual test on the robot.
picrawler_services_start: false

picrawler_services: >-
  {{ picrawler_core_services
     + (picrawler_speech_services if picrawler_speech_enabled | bool else [])
     + (picrawler_display_services if picrawler_display_enabled | bool else []) }}

picrawler_core_services:
  - name: body
    module: services.body
    description: PiCrawler body (servos, executor, MQTT adapter)
    mqtt_user: body
    restart: on-failure
    stop_timeout: 10
  - name: arbiter
    module: services.arbiter
    description: PiCrawler arbiter (sensor facts to commands)
    mqtt_user: arbiter
    restart: on-failure
    stop_timeout: 5
  - name: vision
    module: services.vision
    description: PiCrawler vision (camera, stream, Coral TPU)
    mqtt_user: sensor-vision
    groups: [video, apex]
    restart: on-failure
    stop_timeout: 5
  - name: web
    module: services.web
    description: PiCrawler web UI (live video, object log, admin)
    mqtt_user: ui
    user: "{{ picrawler_web_user }}"
    groups: [bluetooth, systemd-journal, video]
    restart: on-failure
    stop_timeout: 5

# 128x64 I2C OLED (SSD1306 or SH1106): Wi-Fi quality and usage bars.
picrawler_display_enabled: true
picrawler_display_driver: ssd1306       # sh1106 for most 1.3" modules
picrawler_display_address: "0x3C"
picrawler_display_rotate: 0             # 0..3, quarter turns
picrawler_display_contrast: 128
# Boot splash lives on the SD card: it runs before the NVMe is mounted.
picrawler_splash_dir: /usr/local/lib/picrawler
picrawler_display_thresholds:   # [warning, critical]
  cpu: [80, 95]
  ram: [80, 92]
  sd: [80, 95]
  nvme: [80, 95]
  battery: [20, 5]              # percent left
  temp: [70, 80]                # degrees C
picrawler_display_pip_packages:
  - luma.oled
picrawler_display_services:
  - name: display
    module: services.display
    description: PiCrawler OLED status display
    mqtt_user: display          # only for the battery from the body service
    groups: [i2c]
    conflicts: [picrawler-splash.service]   # starting it ends the boot animation
    nice: 10
    restart: on-failure
    stop_timeout: 5

# Voice stack: USB microphone -> whisper.cpp -> agent (Gemma 4 E2B) -> Piper.
picrawler_speech_enabled: true
picrawler_speech_services:
  - name: whisper
    description: whisper.cpp speech-to-text server (localhost only)
    exec: >-
      {{ picrawler_install_dir }}/whisper.cpp/build/bin/whisper-server
      -m {{ picrawler_speech_dir }}/{{ picrawler_whisper_model_url | basename }}
      -l {{ picrawler_speech_language }} -t 3 --host 127.0.0.1 --port 8082
    groups: []
    nice: 10
    restart: on-failure
    stop_timeout: 5
  - name: agent
    module: services.agent
    description: PiCrawler agent (offline language model with robot tools)
    mqtt_user: agent
    groups: []
    nice: 10
    # leave one core for body, vision and the stream
    cpu_quota: 300%
    restart: on-failure
    stop_timeout: 10
  - name: voice
    module: services.voice
    description: PiCrawler voice (Piper text-to-speech)
    mqtt_user: voice
    groups: [audio, gpio]
    nice: 5
    restart: on-failure
    stop_timeout: 5

# Each sensor runs as picrawler-sensor@<name> with MQTT user sensor-<name>.
picrawler_sensors: []

picrawler_mqtt_host: "127.0.0.1"
picrawler_mqtt_port: "{{ mosquitto_port | default(1883) }}"
picrawler_mqtt_secret_dir: "{{ mosquitto_client_secret_dir | default('/etc/picrawler/mqtt') }}"

# body.toml (see docs/target-architecture.md, section 9)
picrawler_executor_queue_max: 8
picrawler_executor_lockout_s: 1.0
picrawler_watchdog_heartbeat_timeout_s: 1.0
picrawler_watchdog_sit_after_disconnect_s: 5.0
picrawler_steps_max: 10
# 2S Li-ion pack: warn below low_v, sit down and refuse motion below critical_v
picrawler_battery_low_v: 7.0
picrawler_battery_critical_v: 6.6
picrawler_allowed_actions:
  - stand
  - sit
  - forward
  - backward
  - turn left
  - turn right
  - wave

# arbiter.toml
picrawler_obstacle_stop_cm: 15
# Manual control with a gamepad; button names: see the admin page.
picrawler_manual_speed: 70
picrawler_manual_buttons:
  BTN_SOUTH: stand
  BTN_EAST: sit
  BTN_NORTH: wave
picrawler_manual_stop_button: BTN_SELECT
picrawler_wander_enabled: false
picrawler_wander_clear_cm: 25
picrawler_wander_speed: 70

# sensor-<name>.toml, extra keys of the [sensor] table per sensor
picrawler_sensor_settings:
  ultrasonic:
    rate_hz: 10
    trig_pin: D2
    echo_pin: D3
  gamepad:
    rate_hz: 10
    device_name: ""        # substring of the pad name; empty = first gamepad found
    deadzone: 0.15
  speech:
    device_name: ""        # substring of the microphone name; empty = first input device
    language: "{{ picrawler_speech_language }}"
    whisper_url: http://127.0.0.1:8082/inference
    vad_ratio: 3.0
    end_ms: 700

# Speech (whisper.cpp) and voice (Piper)
picrawler_speech_language: de
picrawler_speech_dir: "{{ picrawler_state_dir }}/speech"
picrawler_whisper_repo: https://github.com/ggml-org/whisper.cpp.git
picrawler_whisper_version: v1.7.4
# base: fast; small: better German, about 3x slower
picrawler_whisper_model_url: https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin
picrawler_piper_url: https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_aarch64.tar.gz
picrawler_piper_voice_url: https://huggingface.co/rhasspy/piper-voices/resolve/main/de/de_DE/thorsten/medium/de_DE-thorsten-medium.onnx

# Agent: .litertlm model file (Gemma 4 E2B from the litert-community
# organisation on Hugging Face). Empty: only the keyword parser runs.
picrawler_agent_model_url: ""
picrawler_agent_dir: "{{ picrawler_state_dir }}/agent"
# Optional stronger brain in the LAN (OpenAI-compatible, e.g. llama-server
# or Ollama on a Mac); tried first, skipped while unreachable.
picrawler_agent_remote_url: ""
picrawler_agent_remote_model: ""
picrawler_agent_wake_words: [crawler, krabbler, roboter]

# vision.toml
picrawler_vision_mode: detect
picrawler_vision_size: [960, 540]
picrawler_vision_fps: 15
# Floor edge for the local map. Camera mounting values are estimates for the
# original module on the head; calibrate with tape at 30/60 cm on the floor.
picrawler_vision_floor: true
picrawler_camera_hfov_deg: 53.5
picrawler_camera_vfov_deg: 31.0
picrawler_camera_height_cm: 9.0
picrawler_camera_tilt_deg: 8.0
picrawler_vision_model_dir: "{{ picrawler_state_dir }}/vision/models"
# Coral test model (SSD MobileNet v2, COCO) from google-coral/test_data
picrawler_vision_download_models: true
picrawler_vision_model_url: https://github.com/google-coral/test_data/raw/master/ssd_mobilenet_v2_coco_quant_postprocess_edgetpu.tflite
picrawler_vision_labels_url: https://github.com/google-coral/test_data/raw/master/coco_labels.txt
picrawler_vision_threshold: 0.4

# web.toml
picrawler_web_listen: "0.0.0.0:8080"
# Self-signed certificate, so passwords never cross the WLAN in clear text.
# The browser warns once; accept the certificate for this host.
picrawler_web_tls: true
picrawler_web_allow_plaintext: false
# [{name, role: admin|viewer, password_hash}], hash: python -m services.web.hashpw
picrawler_web_users: []
picrawler_web_log_retention_days: 7
