---
picrawler_user: picrawler
picrawler_web_user: picrawler-web
picrawler_state_dir: /var/lib/picrawler
picrawler_web_state_dir: /var/lib/picrawler-web    # home of the web user (base role)
picrawler_robot_id: "1"
picrawler_install_dir: /opt/picrawler
picrawler_src_dir: "{{ picrawler_install_dir }}/src"
picrawler_venv: "{{ picrawler_install_dir }}/venv"
picrawler_config_dir: /etc/picrawler

# rsync: copy the local checkout from the control machine (default)
# git:   clone picrawler_git_repo at picrawler_git_version on the Pi
picrawler_source_mode: rsync
picrawler_local_source: "{{ playbook_dir }}/../../"
picrawler_git_repo: ""
picrawler_git_version: motion-framework

# Pin to a commit SHA for reproducible installs.
picrawler_robot_hat_repo: https://github.com/sunfounder/robot-hat.git
picrawler_robot_hat_version: 2.5.x
picrawler_robot_hat_install_overlays: true

picrawler_pip_packages:
  - smbus2
  - paho-mqtt>=2,<3

# Start/enable the units. Starting the body initializes the servos, so
# enable this after a first manual test on the robot.
picrawler_services_start: false

picrawler_services:
  - name: body
    module: services.body
    description: PiCrawler body (servos, executor, MQTT adapter)
    mqtt_user: body
    restart: on-failure
    stop_timeout: 10
  - name: arbiter
    module: services.arbiter
    description: PiCrawler arbiter (sensor facts to commands)
    mqtt_user: arbiter
    restart: on-failure
    stop_timeout: 5
  - name: vision
    module: services.vision
    description: PiCrawler vision (camera, stream, Coral TPU)
    mqtt_user: sensor-vision
    groups: [video, apex]
    restart: on-failure
    stop_timeout: 5
  - name: web
    module: services.web
    description: PiCrawler web UI (live video, object log, admin)
    mqtt_user: ui
    user: "{{ picrawler_web_user }}"
    groups: [bluetooth, systemd-journal, video]
    restart: on-failure
    stop_timeout: 5

# Each sensor runs as picrawler-sensor@<name> with MQTT user sensor-<name>.
picrawler_sensors: []

picrawler_mqtt_host: "127.0.0.1"
picrawler_mqtt_port: "{{ mosquitto_port | default(1883) }}"
picrawler_mqtt_secret_dir: "{{ mosquitto_client_secret_dir | default('/etc/picrawler/mqtt') }}"

# body.toml (see docs/target-architecture.md, section 9)
picrawler_executor_queue_max: 8
picrawler_executor_lockout_s: 1.0
picrawler_watchdog_heartbeat_timeout_s: 1.0
picrawler_watchdog_sit_after_disconnect_s: 5.0
picrawler_steps_max: 10
picrawler_allowed_actions:
  - stand
  - sit
  - forward
  - backward
  - turn left
  - turn right
  - wave

# arbiter.toml
picrawler_obstacle_stop_cm: 15
# Manual control with a gamepad; button names: see the admin page.
picrawler_manual_speed: 70
picrawler_manual_buttons:
  BTN_SOUTH: stand
  BTN_EAST: sit
  BTN_NORTH: wave
picrawler_manual_stop_button: BTN_SELECT
picrawler_wander_enabled: false
picrawler_wander_clear_cm: 25
picrawler_wander_speed: 70

# sensor-<name>.toml, extra keys of the [sensor] table per sensor
picrawler_sensor_settings:
  ultrasonic:
    rate_hz: 10
    trig_pin: D2
    echo_pin: D3
  gamepad:
    rate_hz: 10
    device_name: ""        # substring of the pad name; empty = first gamepad found
    deadzone: 0.15

# vision.toml
picrawler_vision_mode: detect
picrawler_vision_size: [960, 540]
picrawler_vision_fps: 15
picrawler_vision_model_dir: "{{ picrawler_state_dir }}/vision/models"
# Coral test model (SSD MobileNet v2, COCO) from google-coral/test_data
picrawler_vision_download_models: true
picrawler_vision_model_url: https://github.com/google-coral/test_data/raw/master/ssd_mobilenet_v2_coco_quant_postprocess_edgetpu.tflite
picrawler_vision_labels_url: https://github.com/google-coral/test_data/raw/master/coco_labels.txt
picrawler_vision_threshold: 0.4

# web.toml
picrawler_web_listen: "0.0.0.0:8080"
# Self-signed certificate, so passwords never cross the WLAN in clear text.
# The browser warns once; accept the certificate for this host.
picrawler_web_tls: true
picrawler_web_allow_plaintext: false
# [{name, role: admin|viewer, password_hash}], hash: python -m services.web.hashpw
picrawler_web_users: []
picrawler_web_log_retention_days: 7
