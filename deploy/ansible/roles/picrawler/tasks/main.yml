---
- name: Check that every service and sensor has an MQTT account
  ansible.builtin.assert:
    that:
      - (picrawler_services | selectattr('mqtt_user', 'defined') | map(attribute='mqtt_user') | list
         + picrawler_sensors | map('regex_replace', '^(.*)$', 'sensor-\1') | list)
        | difference(mosquitto_users | default([]) | map(attribute='name') | list) | length == 0
    fail_msg: "Each service/sensor needs a matching entry in mosquitto_users (sensors: sensor-<name>)."
    quiet: true

- name: Check web UI users
  ansible.builtin.assert:
    that:
      - picrawler_web_users | length > 0
      - picrawler_web_users | rejectattr('password_hash', 'match', '^scrypt\$') | list | length == 0
      - picrawler_web_users | rejectattr('role', 'in', ['admin', 'viewer']) | list | length == 0
    fail_msg: >-
      picrawler_web_users needs at least one user with role admin|viewer and a scrypt
      password_hash (python -m services.web.hashpw, store it in the vault).
    quiet: true
  when: "'web' in picrawler_services | map(attribute='name')"

- name: Create install directory
  ansible.builtin.file:
    path: "{{ picrawler_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create config directory
  ansible.builtin.file:
    path: "{{ picrawler_config_dir }}"
    state: directory
    owner: root
    group: "{{ picrawler_user }}"
    # traverse for the web user too; each file has its own group
    mode: "0751"

- name: Deploy source
  ansible.builtin.include_tasks: "source_{{ picrawler_source_mode }}.yml"

- name: Fetch robot_hat
  ansible.builtin.git:
    repo: "{{ picrawler_robot_hat_repo }}"
    dest: "{{ picrawler_install_dir }}/robot-hat"
    version: "{{ picrawler_robot_hat_version }}"
    depth: 1
  register: picrawler_robot_hat_src

- name: Install robot_hat device tree overlays
  ansible.builtin.include_tasks: overlays.yml
  when: picrawler_robot_hat_install_overlays | bool

- name: Create virtualenv
  ansible.builtin.command: python3 -m venv --system-site-packages {{ picrawler_venv }}
  args:
    creates: "{{ picrawler_venv }}/bin/python"

- name: Install python dependencies
  ansible.builtin.pip:
    name: "{{ picrawler_pip_packages }}"
    virtualenv: "{{ picrawler_venv }}"

- name: Install display python dependencies
  ansible.builtin.pip:
    name: "{{ picrawler_display_pip_packages }}"
    virtualenv: "{{ picrawler_venv }}"
  when: picrawler_display_enabled | bool

- name: Install agent python dependencies
  ansible.builtin.pip:
    name: "{{ picrawler_agent_pip_packages }}"
    virtualenv: "{{ picrawler_venv }}"
  when: picrawler_speech_enabled | bool

- name: Install robot_hat and picrawler into the virtualenv
  ansible.builtin.include_tasks: pip_local.yml
  loop:
    - name: robot_hat
      path: "{{ picrawler_install_dir }}/robot-hat"
      changed: "{{ picrawler_robot_hat_src.changed }}"
    - name: picrawler
      path: "{{ picrawler_src_dir }}"
      changed: "{{ picrawler_source.changed }}"
  loop_control:
    loop_var: pkg
    label: "{{ pkg.name }}"

- name: Write service configs
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ picrawler_config_dir }}/{{ item.dest }}"
    owner: root
    group: "{{ item.group | default(picrawler_user) }}"
    mode: "0640"
  loop:
    - { src: body.toml.j2, dest: body.toml }
    - { src: arbiter.toml.j2, dest: arbiter.toml }
    - { src: vision.toml.j2, dest: vision.toml }
    - { src: web.toml.j2, dest: web.toml, group: "{{ picrawler_web_user }}" }
  loop_control:
    label: "{{ item.dest }}"
  notify: Restart picrawler

- name: Write display config
  ansible.builtin.template:
    src: display.toml.j2
    dest: "{{ picrawler_config_dir }}/display.toml"
    owner: root
    group: "{{ picrawler_user }}"
    mode: "0640"
  when: picrawler_display_enabled | bool
  notify: Restart picrawler

- name: Set up the OLED boot splash
  ansible.builtin.include_tasks: splash.yml
  when: picrawler_display_enabled | bool

- name: Write voice stack configs
  ansible.builtin.template:
    src: "{{ item }}.toml.j2"
    dest: "{{ picrawler_config_dir }}/{{ item }}.toml"
    owner: root
    group: "{{ picrawler_user }}"
    mode: "0640"
  loop: [agent, voice]
  when: picrawler_speech_enabled | bool
  notify: Restart picrawler

- name: Set up the voice stack
  ansible.builtin.include_tasks: speech.yml
  when: picrawler_speech_enabled | bool

- name: Create vision model directory
  ansible.builtin.file:
    path: "{{ picrawler_vision_model_dir }}"
    state: directory
    owner: "{{ picrawler_user }}"
    group: "{{ picrawler_user }}"
    mode: "0755"

- name: Download Coral test model and labels
  ansible.builtin.get_url:
    url: "{{ item }}"
    dest: "{{ picrawler_vision_model_dir }}/{{ item | basename }}"
    owner: "{{ picrawler_user }}"
    group: "{{ picrawler_user }}"
    mode: "0644"
  loop:
    - "{{ picrawler_vision_model_url }}"
    - "{{ picrawler_vision_labels_url }}"
  when: picrawler_vision_download_models | bool

- name: Create web TLS directory
  ansible.builtin.file:
    path: "{{ picrawler_config_dir }}/web-tls"
    state: directory
    owner: root
    group: "{{ picrawler_web_user }}"
    mode: "0750"
  when: picrawler_web_tls | bool

- name: Create self-signed certificate for the web UI
  ansible.builtin.command: >-
    openssl req -x509 -newkey rsa:2048 -nodes -days 3650
    -subj "/CN={{ inventory_hostname }}"
    -addext "subjectAltName=DNS:{{ inventory_hostname }},DNS:{{ ansible_facts['hostname'] | default(inventory_hostname) }}.local"
    -keyout {{ picrawler_config_dir }}/web-tls/key.pem
    -out {{ picrawler_config_dir }}/web-tls/cert.pem
  args:
    creates: "{{ picrawler_config_dir }}/web-tls/cert.pem"
  when: picrawler_web_tls | bool
  notify: Restart picrawler

- name: Make the TLS key readable for the web user
  ansible.builtin.file:
    path: "{{ picrawler_config_dir }}/web-tls/key.pem"
    owner: root
    group: "{{ picrawler_web_user }}"
    mode: "0640"
  when: picrawler_web_tls | bool

- name: Allow the web user to restart PiCrawler units and power off (polkit)
  ansible.builtin.template:
    src: polkit-picrawler-web.rules.j2
    dest: /etc/polkit-1/rules.d/50-picrawler-web.rules
    owner: root
    group: root
    mode: "0644"

- name: Write sensor configs
  ansible.builtin.template:
    src: sensor.toml.j2
    dest: "{{ picrawler_config_dir }}/sensor-{{ sensor }}.toml"
    owner: root
    group: "{{ picrawler_user }}"
    mode: "0640"
  loop: "{{ picrawler_sensors }}"
  loop_control:
    loop_var: sensor
  notify: Restart picrawler

- name: Install service units
  ansible.builtin.template:
    src: service.j2
    dest: "/etc/systemd/system/picrawler-{{ service.name }}.service"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ picrawler_services }}"
  loop_control:
    loop_var: service
    label: "{{ service.name }}"
  notify: [Reload systemd, Restart picrawler]

- name: Install sensor unit template and target
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - picrawler-sensor@.service
    - picrawler.target
  notify: [Reload systemd, Restart picrawler]

- name: Reload systemd before enabling units
  ansible.builtin.meta: flush_handlers

- name: Enable and start the robot stack
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: >-
    {{ ['picrawler.target']
       + picrawler_services | map(attribute='name') | map('regex_replace', '^(.*)$', 'picrawler-\1.service') | list
       + picrawler_sensors | map('regex_replace', '^(.*)$', 'picrawler-sensor@\1.service') | list }}
  when: picrawler_services_start | bool

- name: Remind that services are not started
  ansible.builtin.debug:
    msg: >-
      Units are installed but not started (picrawler_services_start: false).
      Test once by hand (see services/README.md), then set it to true.
  when: not (picrawler_services_start | bool)
