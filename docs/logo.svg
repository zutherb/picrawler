<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="PiCrawler">
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.75" stop-color="#F4F1EA"/>
      <stop offset="1" stop-color="#E2DDD2"/>
    </linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC555"/>
      <stop offset="1" stop-color="#E89A0C"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C1F28"/>
      <stop offset="1" stop-color="#0D0F14"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="100" cy="189" rx="50" ry="5" fill="#000" opacity="0.18"/>

  <!-- back legs (behind the ball) -->
  <g stroke-linecap="round">
    <path d="M86 140 L82 180" stroke="#D3CEC4" stroke-width="12"/>
    <path d="M114 140 L118 180" stroke="#D3CEC4" stroke-width="12"/>
    <path d="M82 180 L81.6 184" stroke="#1A1C22" stroke-width="7"/>
    <path d="M118 180 L118.4 184" stroke="#1A1C22" stroke-width="7"/>
  </g>

  <!-- ball: head and body in one -->
  <ellipse cx="100" cy="90" rx="66" ry="62" fill="url(#shell)" stroke="#CBC5B9" stroke-width="1.2"/>

  <!-- front legs -->
  <g stroke-linecap="round">
    <path d="M70 138 L60 182" stroke="#CBC5B9" stroke-width="16.4"/>
    <path d="M130 138 L140 182" stroke="#CBC5B9" stroke-width="16.4"/>
    <path d="M70 138 L60 182" stroke="url(#shell)" stroke-width="14"/>
    <path d="M130 138 L140 182" stroke="url(#shell)" stroke-width="14"/>
    <path d="M60.5 181 L59 187" stroke="#1A1C22" stroke-width="8"/>
    <path d="M139.5 181 L141 187" stroke="#1A1C22" stroke-width="8"/>
  </g>
  <!-- leg joints: amber ring, dark hub -->
  <circle cx="70" cy="138" r="8" fill="url(#ear)"/>
  <circle cx="130" cy="138" r="8" fill="url(#ear)"/>
  <circle cx="70" cy="138" r="3.6" fill="#2A2D36"/>
  <circle cx="130" cy="138" r="3.6" fill="#2A2D36"/>

  <!-- side camera lenses -->
  <ellipse cx="36" cy="92" rx="7" ry="14" fill="url(#ear)"/>
  <ellipse cx="164" cy="92" rx="7" ry="14" fill="url(#ear)"/>
  <ellipse cx="35.5" cy="92" rx="4.2" ry="9.5" fill="#2A2D36"/>
  <ellipse cx="164.5" cy="92" rx="4.2" ry="9.5" fill="#2A2D36"/>

  <!-- camera ring on top -->
  <ellipse cx="100" cy="30" rx="13" ry="5.6" fill="url(#ear)"/>
  <ellipse cx="100" cy="29.6" rx="8" ry="3.4" fill="#0D0F14"/>
  <ellipse cx="97.6" cy="28.6" rx="2" ry="0.9" fill="#FFFFFF" opacity="0.8"/>

  <!-- screen face with comic eyes and smile -->
  <rect x="54" y="56" width="92" height="68" rx="28" fill="url(#visor)"/>
  <g filter="url(#glow)">
    <circle cx="81" cy="85" r="13" fill="#FFFFFF"/>
    <circle cx="119" cy="85" r="13" fill="#FFFFFF"/>
    <circle cx="81" cy="85" r="7.6" fill="#0D0F14"/>
    <circle cx="119" cy="85" r="7.6" fill="#0D0F14"/>
    <circle cx="78.4" cy="82.1" r="2.3" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="116.4" cy="82.1" r="2.3" fill="#FFFFFF" opacity="0.9"/>
  </g>
  <path d="M92 106 Q100 113 108 106" fill="none" stroke="#FFB020" stroke-width="3.2" stroke-linecap="round"/>
  <ellipse cx="67" cy="106" rx="5" ry="3.2" fill="#FF8C8C" opacity="0.9"/>
  <ellipse cx="133" cy="106" rx="5" ry="3.2" fill="#FF8C8C" opacity="0.9"/>
</svg>
