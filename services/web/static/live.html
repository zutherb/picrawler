<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PiCrawler live</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <main>
    <div class="grid-live">
      <section class="panel">
        <div class="row">
          <h2>Camera</h2>
          <label class="muted"><input type="checkbox" id="boxes" checked> boxes</label>
          <span class="muted" id="objects"></span>
        </div>
        <div class="video">
          <div class="placeholder" id="placeholder">No video. Is the vision service running?</div>
          <img id="video" alt="Camera stream">
          <canvas id="overlay"></canvas>
        </div>
      </section>
      <section class="panel">
        <h2>Recent</h2>
        <ul class="feed" id="feed"></ul>
      </section>
    </div>
    <section class="panel">
      <div class="row">
        <h2>Status</h2>
        <button id="stop-sit">Stop and sit down</button>
      </div>
      <div class="tiles" id="tiles"></div>
    </section>
  </main>
  <script src="/static/app.js"></script>
  <script src="/static/live.js"></script>
</body>
</html>
