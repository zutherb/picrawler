<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PiCrawler live</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/theme.js"></script>
  <link rel="icon" href="/static/logo-mark.svg" type="image/svg+xml">
</head>
<body>
  <main>
    <div class="grid-live">
      <section class="panel">
        <div class="row">
          <h2>Camera</h2>
          <label class="muted"><input type="checkbox" id="boxes" checked> boxes</label>
          <span class="muted" id="objects"></span>
        </div>
        <div class="video">
          <div class="placeholder" id="placeholder">No video. Is the vision service running?</div>
          <img id="video" alt="Camera stream">
          <canvas id="overlay"></canvas>
        </div>
      </section>
      <div class="side">
        <section class="panel" id="oled-panel">
          <div class="row">
            <h2>Display</h2>
            <span class="muted" id="oled-note">waiting for the display…</span>
          </div>
          <div class="oled-bezel"><canvas id="oled" width="128" height="64"></canvas></div>
        </section>
        <section class="panel recent" id="recent" tabindex="0" role="button" aria-label="Show all log entries">
          <div class="row">
            <h2>Recent</h2>
            <span class="muted more">show all →</span>
          </div>
          <ul class="feed compact" id="feed"></ul>
        </section>
      </div>
    </div>
    <section class="panel admin-only hidden" id="agent-panel">
      <div class="row">
        <h2>Agent</h2>
        <span class="muted" id="agent-state"></span>
      </div>
      <form class="row" id="agent-form">
        <input id="agent-text" placeholder="e.g. find the cat / walk two steps forward" maxlength="500" autocomplete="off">
        <button class="primary" type="submit">Send</button>
      </form>
      <ul class="feed" id="agent-replies"></ul>
    </section>
    <section class="panel">
      <div class="row">
        <h2>Status</h2>
        <button id="stop-sit">Stop and sit down</button>
      </div>
      <div class="tiles" id="tiles"></div>
    </section>
  </main>

  <dialog id="log-dialog" class="log-dialog">
    <div class="row">
      <h2>All entries</h2>
      <input id="log-filter" placeholder="Filter (label or text)" autocomplete="off">
      <span class="muted" id="log-count"></span>
      <button class="stop" id="dialog-stop">STOP</button>
      <button id="log-close">Close</button>
    </div>
    <div class="dialog-body">
      <table>
        <thead><tr><th>Start</th><th>End</th><th>Label</th><th>Score</th><th>Count</th><th>Details</th></tr></thead>
        <tbody id="log-rows"></tbody>
      </table>
    </div>
  </dialog>
  <script src="/static/app.js"></script>
  <script src="/static/live.js"></script>
</body>
</html>
