<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PiCrawler login</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/theme.js"></script>
  <link rel="icon" href="/static/logo-mark.svg" type="image/svg+xml">
</head>
<body class="login-page">
  <main>
    <div class="login">
      <img class="mascot" src="/static/logo.svg" alt="PiCrawler robot">
      <div class="eyebrow">Robot control</div>
      <h1>PiCrawler</h1>
      <div class="prompt">picrawler@robot:~$ login <span class="cursor">▌</span></div>
      <form method="post" action="/login">
        <p class="error hidden" id="error"></p>
        <input name="user" placeholder="User" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required autofocus>
        <input name="password" type="password" placeholder="Password" autocomplete="current-password" required>
        <button class="primary" type="submit">Log in</button>
      </form>
    </div>
  </main>
  <script src="/static/login.js"></script>
</body>
</html>
