<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PiCrawler">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232631"/>
      <stop offset="1" stop-color="#0D0F14"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F4F1EA"/>
    </linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC555"/>
      <stop offset="1" stop-color="#E89A0C"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="none" stroke="#FFB020" stroke-opacity="0.45" stroke-width="1.2"/>
  <!-- back legs -->
  <path d="M27 46 L25.5 55" stroke="#D3CEC4" stroke-width="4.4" stroke-linecap="round"/>
  <path d="M37 46 L38.5 55" stroke="#D3CEC4" stroke-width="4.4" stroke-linecap="round"/>
  <!-- ball -->
  <ellipse cx="32" cy="29" rx="22" ry="20.5" fill="url(#shell)"/>
  <!-- front legs and joints -->
  <path d="M21.5 45 L18 56.5" stroke="#FFFFFF" stroke-width="5.2" stroke-linecap="round"/>
  <path d="M42.5 45 L46 56.5" stroke="#FFFFFF" stroke-width="5.2" stroke-linecap="round"/>
  <circle cx="21.5" cy="45" r="2.7" fill="url(#ear)"/>
  <circle cx="42.5" cy="45" r="2.7" fill="url(#ear)"/>
  <!-- side lenses -->
  <ellipse cx="10.5" cy="30" rx="2.6" ry="5.2" fill="url(#ear)"/>
  <ellipse cx="53.5" cy="30" rx="2.6" ry="5.2" fill="url(#ear)"/>
  <!-- camera ring on top -->
  <ellipse cx="32" cy="9.2" rx="5" ry="2.2" fill="url(#ear)"/>
  <ellipse cx="32" cy="9" rx="3" ry="1.3" fill="#14161D"/>
  <!-- screen, eyes, smile -->
  <rect x="17" y="17.5" width="30" height="24" rx="9.5" fill="#0D0F14"/>
  <circle cx="25.5" cy="28" r="5" fill="#FFFFFF"/>
  <circle cx="38.5" cy="28" r="5" fill="#FFFFFF"/>
  <circle cx="25.5" cy="28" r="2.9" fill="#14161D"/>
  <circle cx="38.5" cy="28" r="2.9" fill="#14161D"/>
  <circle cx="24.5" cy="26.8" r="0.9" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="37.5" cy="26.8" r="0.9" fill="#FFFFFF" opacity="0.9"/>
  <path d="M29.2 35.8 Q32 38.4 34.8 35.8" fill="none" stroke="#FFB020" stroke-width="1.4" stroke-linecap="round"/>
  <ellipse cx="20.6" cy="36.6" rx="2" ry="1.25" fill="#FF8C8C"/>
  <ellipse cx="43.4" cy="36.6" rx="2" ry="1.25" fill="#FF8C8C"/>
</svg>
