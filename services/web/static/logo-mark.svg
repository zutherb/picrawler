<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PiCrawler">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B1E7A"/>
      <stop offset="1" stop-color="#24104F"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E3E8F3"/>
    </linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3D8BFF"/>
      <stop offset="1" stop-color="#2557C7"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <!-- antenna -->
  <path d="M41 15 L45 8" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="46" cy="6.5" r="3.4" fill="#FFFFFF"/>
  <!-- ears -->
  <rect x="7" y="25" width="9" height="19" rx="4.5" fill="url(#ear)"/>
  <rect x="48" y="25" width="9" height="19" rx="4.5" fill="url(#ear)"/>
  <!-- head -->
  <rect x="12" y="13" width="40" height="42" rx="17" fill="url(#shell)"/>
  <!-- visor and eyes -->
  <rect x="17" y="21" width="30" height="24" rx="9.5" fill="#0B0A26"/>
  <circle cx="26" cy="32.5" r="4.6" fill="none" stroke="#30D5C0" stroke-width="2.6"/>
  <circle cx="38" cy="32.5" r="4.6" fill="none" stroke="#30D5C0" stroke-width="2.6"/>
  <ellipse cx="22" cy="40" rx="2.3" ry="1.4" fill="#FF8C8C"/>
  <ellipse cx="42" cy="40" rx="2.3" ry="1.4" fill="#FF8C8C"/>
</svg>
